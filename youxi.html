<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>推箱子·小工程师的仓库挑战 | 四年级编程思维游戏</title>
    <style>
        * {
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1e5a3a 0%, #0f3b24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .game-wrapper {
            background: #d9b382;
            padding: 25px 30px 20px 30px;
            border-radius: 65px;
            box-shadow: 0 20px 0 #7a4c2c, inset 0 1px 4px rgba(255,255,200,0.8);
        }
        .game-container {
            background: #2c1e12;
            padding: 20px;
            border-radius: 35px;
            display: inline-block;
            box-shadow: inset 0 0 0 3px #f7e5b5, 0 10px 20px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            background-color: #ecd9b4;
            box-shadow: 0 6px 0 #5a3a22;
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .level-box {
            background: #2d2218;
            color: #ffdd99;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
            box-shadow: inset 0 1px 3px #826a48, 0 3px 0 #2a1a0c;
        }
        button {
            background: #ffbb77;
            border: none;
            font-size: 20px;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 50px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #a5622c;
            color: #2e241a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a5622c;
        }
        .message {
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 32px;
            color: #ffe6b3;
            font-weight: bold;
            font-size: 16px;
        }
        .controls {
            background: #2d241cb3;
            border-radius: 50px;
            padding: 5px 12px;
            color: #fdebb3;
            font-size: 14px;
        }
        @media (max-width: 550px) {
            .game-wrapper { padding: 15px; }
            .level-box { font-size: 18px; }
            button { font-size: 16px; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-wrapper">
        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
        <div class="info-bar">
            <div class="level-box">📦 第 <span id="levelNum">1</span> / <span id="totalLevels">6</span> 关</div>
            <button id="resetBtn">🔄 重置关卡</button>
            <div class="message">⭐ 把箱子推到红色星星上 ⭐</div>
        </div>
        <div class="controls" style="margin-top: 12px; text-align:center;">
            🎮 方向键移动 | R 键重置当前关 | 全部通关会有烟花彩蛋！
        </div>
    </div>
</div>

<script>
    // 6 关高难度推箱子地图
    const levels = [
        // 1 简单
        [
            "########",
            "#      #",
            "#  $   #",
            "#  .   #",
            "#  @   #",
            "#      #",
            "#      #",
            "########"
        ],
        // 2 入门
        [
            "########",
            "#      #",
            "#  $   #",
            "#  .   #",
            "#   @  #",
            "#      #",
            "#      #",
            "########"
        ],
        // 3 双箱子
        [
            "########",
            "#  .   #",
            "#  $   #",
            "#      #",
            "#  $   #",
            "#  .   #",
            "#    @ #",
            "########"
        ],
        // 4 中等难度
        [
            "########",
            "# .$.  #",
            "#  $   #",
            "#  ##  #",
            "#   @  #",
            "#      #",
            "#      #",
            "########"
        ],
        // 5 困难
        [
            "########",
            "# .$.  #",
            "# #$   #",
            "# .$   #",
            "#  @   #",
            "#      #",
            "#      #",
            "########"
        ],
        // 6 极难挑战
        [
            "########",
            "#.$. $.#",
            "# #$#  #",
            "# .$ . #",
            "#  @   #",
            "#      #",
            "#      #",
            "########"
        ]
    ];

    let currentLevel = 0;
    let levelMap = [];
    let playerX = -1, playerY = -1;
    let boxCount = 0;
    let boxesOnTarget = 0;
    const CELL_SIZE = 50;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelNumSpan = document.getElementById('levelNum');
    const totalLevelsSpan = document.getElementById('totalLevels');
    const resetBtn = document.getElementById('resetBtn');

    totalLevelsSpan.innerText = levels.length;

    // 绘制五角星（红色目标点）
    function drawStar(cx, cy, r) {
        ctx.fillStyle = "#ff2222";
        ctx.beginPath();
        for(let i=0;i<5;i++){
            let angle = Math.PI/2 + i*Math.PI*2/5;
            let x = cx + Math.cos(angle)*r;
            let y = cy - Math.sin(angle)*r;
            if(i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
            angle += Math.PI/5;
            x = cx + Math.cos(angle)*(r*0.4);
            y = cy - Math.sin(angle)*(r*0.4);
            ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fill();
    }

    function loadLevel(idx) {
        const raw = levels[idx];
        levelMap = raw.map(row => [...row]);
        playerX = -1;
        playerY = -1;
        boxCount = 0;
        boxesOnTarget = 0;

        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const c = levelMap[y][x];
                if (c === '@' || c === '+') {
                    playerX = x;
                    playerY = y;
                    levelMap[y][x] = ' ';
                }
                if (c === '$' || c === '*') boxCount++;
            }
        }
        drawGame();
    }

    function drawGame() {
        ctx.clearRect(0, 0, 400, 400);

        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const cell = levelMap[y][x];
                const px = x * CELL_SIZE;
                const py = y * CELL_SIZE;
                const centerX = px + 25;
                const centerY = py + 25;

                if (cell === '#') {
                    ctx.fillStyle = '#5a3a22';
                    ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = '#8b5a3b';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(px + 3, py + 3, CELL_SIZE - 6, CELL_SIZE - 6);
                }
                // 红色五角星目标点
                else if (cell === '.') {
                    drawStar(centerX, centerY, 14);
                }
                // 普通箱子
                else if (cell === '$') {
                    ctx.fillStyle = '#ff9c47';
                    ctx.fillRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                    ctx.strokeStyle = '#a85a1c';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                }
                // 箱子在星星上
                else if (cell === '*') {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                    ctx.strokeStyle = '#c72e2e';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                    drawStar(centerX, centerY, 14);
                }
            }
        }

        // 绘制可爱工人小人（替代蓝色圆圈）
        const px = playerX * CELL_SIZE + 25;
        const py = playerY * CELL_SIZE + 22;
        // 帽子
        ctx.fillStyle="#ffcc33";
        ctx.beginPath();
        ctx.ellipse(px, py-12,14,6,0,0,Math.PI*2);
        ctx.fill();
        // 头
        ctx.fillStyle="#ffddbb";
        ctx.beginPath();
        ctx.arc(px, py,14,0,Math.PI*2);
        ctx.fill();
        // 眼睛
        ctx.fillStyle="#222";
        ctx.beginPath();
        ctx.arc(px-5,py-2,2.5,0,Math.PI*2);
        ctx.arc(px+5,py-2,2.5,0,Math.PI*2);
        ctx.fill();
        // 身体
        ctx.fillStyle="#4287f5";
        ctx.fillRect(px-10,py+12,20,14);
    }

    function move(dx, dy) {
        const nx = playerX + dx;
        const ny = playerY + dy;

        // 撞墙 或 直接踩到箱子：禁止移动（修复踩箱子BUG）
        if (levelMap[ny][nx] === '#' || levelMap[ny][nx] === '$' || levelMap[ny][nx] === '*') {
            return;
        }

        // 普通移动
        playerX = nx;
        playerY = ny;
        drawGame();
    }

    window.addEventListener('keydown', e => {
        switch (e.key) {
            case 'ArrowUp': move(0, -1); break;
            case 'ArrowDown': move(0, 1); break;
            case 'ArrowLeft': move(-1, 0); break;
            case 'ArrowRight': move(1, 0); break;
            case 'r': case 'R': loadLevel(currentLevel); break;
        }
    });

    resetBtn.onclick = () => loadLevel(currentLevel);

    // 推箱子逻辑（独立处理推箱子）
    window.addEventListener('keydown', e => {
        let dx=0,dy=0;
        if(e.key==='ArrowUp') dy=-1;
        if(e.key==='ArrowDown') dy=1;
        if(e.key==='ArrowLeft') dx=-1;
        if(e.key==='ArrowRight') dx=1;
        if(dx===0&&dy===0)return;

        const nx = playerX + dx;
        const ny = playerY + dy;
        if(levelMap[ny][nx]==='$'||levelMap[ny][nx]==='*'){
            const nnx = nx + dx;
            const nny = ny + dy;
            if(levelMap[nny][nnx]===' '||levelMap[nny][nnx]==='.'){
                const wasOnTarget = levelMap[ny][nx]==='*';
                const willBeOnTarget = levelMap[nny][nnx]==='.';

                levelMap[ny][nx] = wasOnTarget ? '.' : ' ';
                levelMap[nny][nnx] = willBeOnTarget ? '*' : '$';

                if(wasOnTarget) boxesOnTarget--;
                if(willBeOnTarget) boxesOnTarget++;

                playerX = nx;
                playerY = ny;
                checkWin();
                drawGame();
            }
        }
    });

    function checkWin() {
        if (boxesOnTarget === boxCount) {
            setTimeout(() => {
                if (currentLevel < levels.length - 1) {
                    currentLevel++;
                    levelNumSpan.innerText = currentLevel + 1;
                    loadLevel(currentLevel);
                    alert('🎉 太厉害了！下一关更有挑战！');
                } else {
                    alert('🏆 终极通关！你是推箱子大师！');
                    fireworks();
                }
            }, 200);
        }
    }

    function fireworks() {
        const count = 120;
        for (let i = 0; i < count; i++) {
            const circle = document.createElement('div');
            document.body.appendChild(circle);
            circle.style.cssText = `
                position: fixed;
                width: 8px; height: 8px;
                background: hsl(${Math.random() * 360},100%,60%);
                border-radius: 50%;
                left: 50%; top: 50%;
                pointer-events: none;
                transform: translate(-50%,-50%);
                animation: firework 1.4s ease-out forwards;
            `;
            const a = Math.random() * Math.PI * 2;
            const d = 120 + Math.random() * 240;
            circle.style.setProperty('--dx', Math.cos(a) * d + 'px');
            circle.style.setProperty('--dy', Math.sin(a) * d + 'px');
            setTimeout(() => circle.remove(), 1400);
        }
    }

    loadLevel(0);

    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes firework {
            0% { transform: translate(-50%,-50%); opacity:1; }
            100% { transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))); opacity:0; }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
